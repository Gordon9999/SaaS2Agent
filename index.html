    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        .report-header {
            text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .report-header h1 { font-size: 1.6rem; font-weight: 700; color: #0f172a; margin-bottom: 0.4rem; }
        .report-header .subtitle { font-size: 0.9rem; color: #64748b; }
        .report-header .meta { font-size: 0.8rem; color: #94a3b8; margin-top: 0.4rem; }
        .section-title {
            font-size: 1.1rem; font-weight: 700; color: #0f172a;
            margin-top: 2rem; margin-bottom: 0.6rem; padding-bottom: 0.4rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
            padding: 0.9rem 1.2rem; margin-bottom: 0.6rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            transition: border-color 0.15s;
        }
        .card:hover { border-color: #2563eb; }
        .card a { color: #2563eb; text-decoration: none; font-size: 0.95rem; word-break: break-all; }
        .card a:hover { text-decoration: underline; }
        .card .icon { margin-right: 0.4rem; }
        .badge {
            flex-shrink: 0; display: inline-block; padding: 0.1rem 0.5rem;
            font-size: 0.72rem; font-weight: 600; border-radius: 4px;
            background: #dcfce7; color: #16a34a; white-space: nowrap;
        }
        .file-list { padding-left: 0.2rem; }
        .file-list .card { padding: 0.6rem 1rem; }
        .dir-card { background: #f1f5f9; }
        .dir-card .dir-name { font-weight: 600; color: #0f172a; }
        .toolbar { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
        .refresh-btn {
            background: #fff; border: 1px solid #2563eb; color: #2563eb;
            border-radius: 6px; padding: 0.35rem 0.9rem; font-size: 0.82rem;
            cursor: pointer; transition: background 0.15s;
        }
        .refresh-btn:hover { background: #eff6ff; }
        .refresh-btn:disabled { opacity: 0.5; cursor: wait; }
        .toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: #0f172a; color: #f8fafc; padding: 0.5rem 1.2rem;
            border-radius: 6px; font-size: 0.82rem; opacity: 0; transition: opacity 0.25s;
            pointer-events: none; z-index: 99;
        }
        .toast.show { opacity: 1; }
        .status { text-align: center; padding: 3rem 1rem; color: #64748b; font-size: 0.95rem; }
        .footer { text-align: center; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0; font-size: 0.8rem; color: #94a3b8; }
        @media (max-width: 640px) {
            .container { padding: 1.5rem 1rem 3rem; }
            .report-header h1 { font-size: 1.3rem; }
            .card { padding: 0.7rem 1rem; }
        }
    </style>
</head>

<script>
(function () {
    'use strict';
    var REPO = 'Gordon9999/AIKefu';
    var BRANCH = 'main';
    var BASE = 'https://gordon9999.github.io/AIKefu/';

    // 内置快照（path 列表），用于「刷新列表」时重新渲染
    var SNAPSHOT = ["cresta/appendix-01.html","cresta/appendix-02.html","cresta/appendix-03.html","cresta/appendix-04.html","cresta/appendix-05.html","cresta/appendix-06.html","cresta/appendix-07.html","cresta/appendix-08.html","cresta/appendix-09.html","cresta/appendix-10.html","cresta/appendix-11.html","cresta/appendix-12.html","cresta/appendix-13.html","cresta/index.html","day.ai/index.html","decagon/appendix-01.html","decagon/appendix-02.html","decagon/appendix-03.html","decagon/appendix-04.html","decagon/appendix-05.html","decagon/appendix-06.html","decagon/appendix-07.html","decagon/appendix-08.html","decagon/appendix-09.html","decagon/appendix-10.html","decagon/appendix-11.html","decagon/appendix-12.html","decagon/appendix-13.html","decagon/index.html","hubspot/appendix-01.html","hubspot/appendix-02.html","hubspot/appendix-03.html","hubspot/appendix-04.html","hubspot/appendix-05.html","hubspot/appendix-06.html","hubspot/appendix-07.html","hubspot/appendix-08.html","hubspot/appendix-09.html","hubspot/appendix-10.html","hubspot/appendix-11.html","hubspot/appendix-12.html","hubspot/appendix-13.html","hubspot/appendix-14.html","hubspot/appendix-15.html","hubspot/appendix-16.html","hubspot/appendix-17.html","hubspot/index.html","intercom/appendix-01.html","intercom/appendix-02.html","intercom/appendix-03.html","intercom/appendix-04.html","intercom/appendix-05.html","intercom/appendix-06.html","intercom/appendix-07.html","intercom/appendix-08.html","intercom/appendix-09.html","intercom/appendix-10.html","intercom/appendix-11.html","intercom/appendix-12.html","intercom/appendix-13.html","intercom/appendix-14.html","intercom/appendix-15.html","intercom/appendix-16.html","intercom/appendix-17.html","intercom/appendix-18.html","intercom/appendix-19.html","intercom/appendix-20.html","intercom/appendix-21.html","intercom/appendix-22.html","intercom/appendix-23.html","intercom/appendix-24.html","intercom/index.html","rox.ai/index.html","salesforce/appendix-01.html","salesforce/appendix-02.html","salesforce/appendix-03.html","salesforce/appendix-04.html","salesforce/appendix-05.html","salesforce/appendix-06.html","salesforce/appendix-07.html","salesforce/appendix-08.html","salesforce/appendix-09.html","salesforce/appendix-10.html","salesforce/appendix-11.html","salesforce/appendix-12.html","salesforce/appendix-13.html","salesforce/appendix-14.html","salesforce/appendix-15.html","salesforce/appendix-16.html","salesforce/appendix-17.html","salesforce/appendix-18.html","salesforce/appendix-19.html","salesforce/appendix-20.html","salesforce/index.html","servicenow/appendix-01.html","servicenow/appendix-02.html","servicenow/appendix-03.html","servicenow/appendix-04.html","servicenow/appendix-05.html","servicenow/appendix-06.html","servicenow/appendix-07.html","servicenow/appendix-08.html","servicenow/appendix-09.html","servicenow/appendix-10.html","servicenow/appendix-11.html","servicenow/appendix-12.html","servicenow/appendix-13.html","servicenow/appendix-14.html","servicenow/appendix-15.html","servicenow/appendix-16.html","servicenow/appendix-17.html","servicenow/appendix-18.html","servicenow/appendix-19.html","servicenow/appendix-20.html","servicenow/index.html","sierra-saas-disruption/appendix-01.html","sierra-saas-disruption/appendix-02.html","sierra-saas-disruption/appendix-03.html","sierra-saas-disruption/appendix-04.html","sierra-saas-disruption/index.html","sierra/appendix-01.html","sierra/appendix-02.html","sierra/appendix-03.html","sierra/appendix-04.html","sierra/appendix-05.html","sierra/appendix-06.html","sierra/appendix-07.html","sierra/appendix-08.html","sierra/appendix-09.html","sierra/index.html","zendesk/appendix-01.html","zendesk/appendix-02.html","zendesk/appendix-03.html","zendesk/appendix-04.html","zendesk/appendix-05.html","zendesk/appendix-06.html","zendesk/appendix-07.html","zendesk/appendix-08.html","zendesk/appendix-09.html","zendesk/appendix-10.html","zendesk/appendix-11.html","zendesk/appendix-12.html","zendesk/appendix-13.html","zendesk/appendix-14.html","zendesk/appendix-15.html","zendesk/appendix-16.html","zendesk/appendix-17.html","zendesk/appendix-18.html","zendesk/appendix-19.html","zendesk/appendix-20.html","zendesk/index.html"];

    function esc(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function buildList(paths) {
        var rootFiles = [];
        var dirMap = {};
        for (var i = 0; i < paths.length; i++) {
            var p = paths[i];
            var idx = p.indexOf('/');
            if (idx === -1) { if (p !== 'index.html') rootFiles.push(p); continue; }
            var dir = p.slice(0, idx + 1);
            var name = p.slice(idx + 1);
            if (!dirMap[dir]) dirMap[dir] = { dir: dir, hasIndex: false, files: [] };
            if (name.toLowerCase() === 'index.html') dirMap[dir].hasIndex = true;
            else dirMap[dir].files.push(name);
        }
        rootFiles.sort(function (a, b) { return a.localeCompare(b, 'zh'); });
        var dirKeys = Object.keys(dirMap).sort(function (a, b) { return a.localeCompare(b, 'zh'); });
        var html = '';
        if (rootFiles.length) {
            html += '<div class="section-title">📄 根目录页面</div>';
            for (var j = 0; j < rootFiles.length; j++) {
                html += '<div class="card file-list"><span><span class="icon">📄</span><a href="' + esc(BASE + encodeURIComponent(rootFiles[j])) + '" target="_blank">' + esc(rootFiles[j]) + '</a></span></div>';
            }
        }
        if (dirKeys.length) {
            html += '<div class="section-title">📁 子目录</div>';
            for (var k = 0; k < dirKeys.length; k++) {
                var d = dirMap[dirKeys[k]];
                var label = d.dir.split('/').filter(Boolean).pop();
                if (d.hasIndex) {
                    html += '<div class="card"><span><span class="icon">📁</span><a href="' + esc(BASE + d.dir + 'index.html') + '" target="_blank">' + esc(label) + '</a></span><span class="badge">主页</span></div>';
                } else {
                    // 无 index.html 的目录：GitHub Pages 不提供目录浏览，直接展开文件列表
                    html += '<div class="card dir-card"><span><span class="icon">📁</span><span class="dir-name">' + esc(label) + '</span></span><span class="badge">' + d.files.length + ' 个页面</span></div>';
                    d.files.sort(function (a, b) { return a.localeCompare(b, 'zh'); });
                    for (var fi = 0; fi < d.files.length; fi++) {
                        html += '<div class="card file-list"><span><span class="icon">📄</span><a href="' + esc(BASE + d.dir + encodeURIComponent(d.files[fi])) + '" target="_blank">' + esc(d.files[fi]) + '</a></span></div>';
                    }
                }
            }
        }
        if (!rootFiles.length && !dirKeys.length) html = '<div class="status">暂无页面</div>';
        return html;
    }

    function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(function () { el.classList.remove('show'); }, 2500);
    }

    document.getElementById('refresh-btn').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        fetch('https://api.github.com/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1', {
            headers: { 'Accept': 'application/vnd.github+json' }
        })
        .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .then(function (data) {
            var paths = (data.tree || [])
                .filter(function (t) { return t.type === 'blob' && t.path.toLowerCase().endsWith('.html'); })
                .map(function (t) { return t.path; });
            SNAPSHOT = paths;
            document.getElementById('content').innerHTML = buildList(paths);
            toast('已刷新 ✅');
        })
        .catch(function (e) { toast('刷新失败：' + e.message); })
        .finally(function () { btn.disabled = false; });
    });

    document.getElementById('footer-date').textContent = new Date().toISOString().slice(0, 10);
})();
</script>
